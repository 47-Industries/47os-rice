; 47OS gamemode configuration
; Applied to /etc/gamemode.ini by 47os-gaming-setup.
[general]
renice=10
ioprio=1
desiredgov=performance
defaultgov=powersave
softrealtime=auto

[filter]
; nothing blocked — Steam/Lutris/Heroic all request gamemode legitimately

[custom]
start=/usr/local/bin/47os-gamemode-hook start
end=/usr/local/bin/47os-gamemode-hook end
